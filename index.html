<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>docsify-robot-md — page de test</title>
  <meta name="description" content="Mini-site Docsify 5 pour tester le plugin docsify-robot-md.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" media="(prefers-color-scheme: dark)">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'docsify-robot-md',
      repo: 'https://github.com/gllmAR/docsify-robot-md',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- Self-test : le plugin est servi depuis ce même site (GitHub Pages). -->
  <script src="./docsify-robot-md.js"></script>
</body>
</html>
